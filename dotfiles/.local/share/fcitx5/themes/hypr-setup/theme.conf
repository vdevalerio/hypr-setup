# GERADO AUTOMATICAMENTE por ~/.config/hypr/themes/theme.py — não edite. Janela de candidatos do fcitx5 (japonês).
[Metadata]
Name=hypr-setup
Version=1
Author=hypr-setup
Description=Cores do tema atual
ScaleWithDPI=True

[InputPanel]
NormalColor=#dbe1eb
HighlightCandidateColor=#0c0e13
HighlightColor=#84bff5
HighlightBackgroundColor=#2f394c
Spacing=4
EnableBlur=False
FullWidthHighlight=True

[InputPanel/TextMargin]
Left=9
Right=9
Top=6
Bottom=6

# Fundo e destaque são imagens (fcitx5_images): borda e seleção em gradiente, como o rofi.
# Margin = cantos que não esticam (9-slice); ContentMargin = onde o texto começa.
[InputPanel/Background]
Image=panel.png
Color=#131820

[InputPanel/Background/Margin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/ContentMargin]
Left=3
Right=3
Top=3
Bottom=3

[InputPanel/Highlight]
Image=highlight.png
Color=#84bff5

[InputPanel/Highlight/Margin]
Left=9
Right=9
Top=6
Bottom=6

[Menu]
NormalColor=#dbe1eb
HighlightCandidateColor=#0c0e13
Spacing=2

[Menu/Background]
Color=#131820
BorderColor=#3c4962
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Image=highlight.png
Color=#84bff5

[Menu/Separator]
Color=#2f394c

[Menu/TextMargin]
Left=8
Right=8
Top=6
Bottom=6
