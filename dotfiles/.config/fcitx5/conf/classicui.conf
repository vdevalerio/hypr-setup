# Janela de candidatos (japonês). Cores: tema hypr-setup, gerado pelo matugen a partir do wallpaper.
# Font é reescrita por ~/.config/hypr/scripts/look.sh (SUPER + ALT + = / -)
Vertical Candidate List=False
WheelForPaging=True
Font="Noto Sans CJK JP 12"
MenuFont="Noto Sans 11"
TrayFont="Noto Sans Bold 10"
PreferTextIcon=True
ShowLayoutNameInIcon=True
UseInputMethodLanguageToDisplayText=True
Theme=hypr-setup
DarkTheme=hypr-setup
UseDarkTheme=False
UseAccentColor=False
PerScreenDPI=True
ForceWaylandDPI=0
EnableFractionalScale=True
