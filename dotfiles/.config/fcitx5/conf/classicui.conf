WheelForPaging=True
Font="Noto Sans CJK JP 15"
MenuFont="Noto Sans 14"
TrayFont="Noto Sans Bold 10"
PreferTextIcon=True
ShowLayoutNameInIcon=True
UseInputMethodLanguageToDisplayText=True
Theme=hypr-setup
DarkTheme=hypr-setup
UseDarkTheme=False
UseAccentColor=False
PerScreenDPI=True
ForceWaylandDPI=0
EnableFractionalScale=True
