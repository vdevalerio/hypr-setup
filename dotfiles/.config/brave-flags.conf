# Idiomas do teclado (fcitx5) no Wayland — veja hypr-setup/README.md
--enable-wayland-ime
--wayland-text-input-version=3
# Vídeo decodificado pela GPU (VA-API) no Wayland: YouTube/Meet sem gastar CPU e bateria.
# Conferir em brave://gpu → "Video Decode: Hardware accelerated"
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
