# lazygit — colors use ANSI names: they follow the terminal theme (theme.py → kitty), including the automatic one.
# magenta = main theme accent, blue = the second, black = surface (color0).
gui:
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor: [magenta, bold]
    inactiveBorderColor: [black]
    searchingActiveBorderColor: [yellow, bold]
    optionsTextColor: [blue]
    selectedLineBgColor: [black]
    inactiveViewSelectedLineBgColor: [black]
    cherryPickedCommitFgColor: [magenta]
    cherryPickedCommitBgColor: [black]
    unstagedChangesColor: [red]
git:
  diffRenderers:
    - command: delta --paging=never
