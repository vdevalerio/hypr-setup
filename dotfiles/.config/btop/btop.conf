# btop — o tema é gerado pelo ~/.config/hypr/themes/theme.py (cores do tema atual)
color_theme = "hypr-setup"
theme_background = false
truecolor = true
rounded_corners = true
graph_symbol = "braille"
vim_keys = true
update_ms = 1500
proc_sorting = "cpu lazy"
save_config_on_exit = false   # mantém este arquivo curto (o btop reescreve tudo ao sair)
