# btop — the theme is generated by ~/.config/hypr/themes/theme.py (current theme colors)
color_theme = "hypr-setup"
theme_background = false
truecolor = true
rounded_corners = true
graph_symbol = "braille"
vim_keys = true
update_ms = 1500
proc_sorting = "cpu lazy"
save_config_on_exit = false   # keeps this file short (btop rewrites everything on exit)
