# tmux — colors come from colors.conf (generated by ~/.config/hypr/themes/theme.py)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-kitty:hyperlinks"
set -g escape-time 10            # no ESC lag in nvim
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1              # windows and panes start at 1, like the keyboard row
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on          # yanks reach the system clipboard (kitty supports OSC 52)
set -g mode-keys vi
set -g status-position top
set -g status-interval 30
set -g status-left-length 30
set -g set-titles on
set -g set-titles-string "#S: #W"
setw -g monitor-bell on

# Prefix: Ctrl+a (Ctrl+b stays free for nvim scrolling)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

source-file ~/.config/tmux/colors.conf

# Sessions survive a reboot: resurrect saves/restores them, continuum saves every 15 min and
# restores by itself when the server starts (Hyprland starts it at login). Plugins are cloned by
# install.sh into plugins/ (not synced). Keep these last: continuum hooks into status-right.
set -g @resurrect-capture-pane-contents on
set -g @continuum-restore on
set -g @continuum-save-interval 15
run-shell "[ -f ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux ] && ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
run-shell "[ -f ~/.config/tmux/plugins/tmux-continuum/continuum.tmux ] && ~/.config/tmux/plugins/tmux-continuum/continuum.tmux"
