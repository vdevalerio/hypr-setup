# Hyprlock — lock screen (SUPER + Esc)
# Esc / Ctrl+U clear the password.
# Background: frame of the current wallpaper (~/.cache/wallpaper/lock.png, generated by wallpaper.sh).
# Profile photo: control center → Appearance → Photo (or scripts/avatar.sh pick).
# Stored in ~/.face; without it an icon is shown.

$font  = JetBrainsMono Nerd Font
$sans  = Adwaita Sans
$info  = ~/.config/hypr/scripts/lockinfo.sh
# Current theme colors (automatic or fixed: ~/.config/hypr/themes/theme.py)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 5, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 4, easeOut
}

background {
    monitor =
    path = ~/.cache/wallpaper/lock.png
    color = $base
    blur_passes = 3
    blur_size = 9
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.25
    noise = 0.012
}

# ── Date and time ─────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %B %d" | tr '[:lower:]' '[:upper:]'
    color = rgba(ffffffaa)
    font_size = 13
    font_family = $sans Medium
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H<span alpha='45%'>:</span>%M"
    color = $text
    font_size = 108
    font_family = $sans Light
    position = 0, 165
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000066)
}

label {
    monitor =
    text = cmd[update:60000] $info greeting
    color = $mauve
    font_size = 15
    font_family = $sans Medium
    position = 0, 75
    halign = center
    valign = center
}

# ── Center card: avatar + password ──────────────────────────
shape {
    monitor =
    size = 380, 230
    color = rgba(ffffff0d)
    rounding = 28
    border_size = 1
    border_color = rgba(ffffff22)
    position = 0, -95
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000055)
}

# Avatar: circle with an icon, or the profile photo (~/.face) when it exists
shape {
    monitor =
    size = 84, 84
    color = rgba(ffffff12)
    rounding = -1
    border_size = 2
    border_color = $mauve $blue 45deg
    position = 0, -35
    halign = center
    valign = center
}

# Icon only when there is no photo (hyprlock doesn't draw in file order)
label {
    monitor =
    text = cmd[update:0] [ -s ~/.face ] || echo 󰀄
    color = $text
    font_size = 30
    font_family = $font
    position = 0, -35
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face
    size = 84
    rounding = -1
    border_size = 2
    border_color = $mauve $blue 45deg
    position = 0, -35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true

    outer_color = $mauve $blue 45deg
    inner_color = rgba(00000055)
    font_color  = $text
    check_color = $green $teal 120deg
    fail_color  = $red
    capslock_color = $yellow

    fade_on_empty = false
    font_family = $font
    placeholder_text = <span alpha="60%">󰌾  Password</span>
    fail_text = <span foreground="##f38ba8">󰀦  $FAIL</span> <span alpha="60%">($ATTEMPTS)</span>
    position = 0, -150
    halign = center
    valign = center
}

# ── Footer ──────────────────────────────────────────────────
# Currently playing music (hidden when nothing is playing)
label {
    monitor =
    text = cmd[update:2000] $info music
    color = rgba(ffffffcc)
    font_size = 12
    font_family = $font
    position = 32, 28
    halign = left
    valign = bottom
}

# Battery
label {
    monitor =
    text = cmd[update:30000] $info battery
    color = rgba(ffffffcc)
    font_size = 12
    font_family = $font
    position = -32, 28
    halign = right
    valign = bottom
}

# Keyboard layout (handy for typing the password)
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(ffffff88)
    font_size = 11
    font_family = $font
    position = 0, 28
    halign = center
    valign = bottom
}
