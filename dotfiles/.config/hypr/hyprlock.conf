# Hyprlock — tela de bloqueio (SUPER + Esc)
# Esc / Ctrl+U limpam a senha.
# Fundo: quadro do wallpaper atual (~/.cache/wallpaper/lock.png, gerado pelo wallpaper.sh).
# Foto de perfil: central de controle → Appearance → Photo (ou scripts/avatar.sh pick).
# Fica em ~/.face; sem ela aparece um ícone.

$font  = JetBrainsMono Nerd Font
$sans  = Adwaita Sans
$info  = ~/.config/hypr/scripts/lockinfo.sh
# Cores do tema atual (automático ou fixo: ~/.config/hypr/themes/theme.py)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 5, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 4, easeOut
}

background {
    monitor =
    path = ~/.cache/wallpaper/lock.png
    color = $base
    blur_passes = 3
    blur_size = 9
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.25
    noise = 0.012
}

# ── Data e hora ─────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %B %d" | tr '[:lower:]' '[:upper:]'
    color = rgba(ffffffaa)
    font_size = 13
    font_family = $sans Medium
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H<span alpha='45%'>:</span>%M"
    color = $text
    font_size = 108
    font_family = $sans Light
    position = 0, 165
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000066)
}

label {
    monitor =
    text = cmd[update:60000] $info greeting
    color = $mauve
    font_size = 15
    font_family = $sans Medium
    position = 0, 75
    halign = center
    valign = center
}

# ── Cartão central: avatar + senha ──────────────────────────
shape {
    monitor =
    size = 380, 230
    color = rgba(ffffff0d)
    rounding = 28
    border_size = 1
    border_color = rgba(ffffff22)
    position = 0, -95
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000055)
}

# Avatar: círculo com ícone, ou a foto de perfil (~/.face) quando ela existe
shape {
    monitor =
    size = 84, 84
    color = rgba(ffffff12)
    rounding = -1
    border_size = 2
    border_color = $mauve $blue 45deg
    position = 0, -35
    halign = center
    valign = center
}

# Ícone só quando não há foto (o hyprlock não desenha na ordem do arquivo)
label {
    monitor =
    text = cmd[update:0] [ -s ~/.face ] || echo 󰀄
    color = $text
    font_size = 30
    font_family = $font
    position = 0, -35
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face
    size = 84
    rounding = -1
    border_size = 2
    border_color = $mauve $blue 45deg
    position = 0, -35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true

    outer_color = $mauve $blue 45deg
    inner_color = rgba(00000055)
    font_color  = $text
    check_color = $green $teal 120deg
    fail_color  = $red
    capslock_color = $yellow

    fade_on_empty = false
    font_family = $font
    placeholder_text = <span alpha="60%">󰌾  Password</span>
    fail_text = <span foreground="##f38ba8">󰀦  $FAIL</span> <span alpha="60%">($ATTEMPTS)</span>
    position = 0, -150
    halign = center
    valign = center
}

# ── Rodapé ──────────────────────────────────────────────────
# Música tocando agora (some quando não há nada tocando)
label {
    monitor =
    text = cmd[update:2000] $info music
    color = rgba(ffffffcc)
    font_size = 12
    font_family = $font
    position = 32, 28
    halign = left
    valign = bottom
}

# Bateria
label {
    monitor =
    text = cmd[update:30000] $info battery
    color = rgba(ffffffcc)
    font_size = 12
    font_family = $font
    position = -32, 28
    halign = right
    valign = bottom
}

# Layout do teclado (útil para digitar a senha)
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(ffffff88)
    font_size = 11
    font_family = $font
    position = 0, 28
    halign = center
    valign = bottom
}
