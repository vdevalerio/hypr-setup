# Kitty

font_family      JetBrainsMono Nerd Font
# Tamanho: font.conf, gerado por ~/.config/hypr/scripts/look.sh (SUPER + ALT + = / -)
include font.conf
shell zsh
disable_ligatures never

window_padding_width 12

# Transparência só no fundo (texto continua nítido); o Hyprland desfoca o que está atrás.
# Ctrl+Shift+A depois M/L: mais/menos opaco · Ctrl+Shift+A depois D: volta ao padrão
background_opacity 0.78
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 3
scrollback_lines 10000
url_style curly
copy_on_select clipboard
mouse_hide_wait 3.0

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# Atalhos úteis: Ctrl+Shift+T nova aba, Ctrl+Shift+Enter dividir,
# Ctrl+Shift+←/→ trocar aba, Ctrl+Shift+=/- tamanho da fonte

# Cores: tema atual (automático ou fixo), gerado por ~/.config/hypr/themes/theme.py
include colors.conf
