# Kitty

font_family      JetBrainsMono Nerd Font
# Size: font.conf, generated by ~/.config/hypr/scripts/look.sh (SUPER + ALT + = / -)
include font.conf
shell sh -c 'exec ~/.config/hypr/scripts/tmux-start.sh'
disable_ligatures never

window_padding_width 12

# Transparency on the background only (text stays sharp); Hyprland blurs what is behind it.
# Ctrl+Shift+A then M/L: more/less opaque · Ctrl+Shift+A then D: back to default
background_opacity 0.78
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 3
scrollback_lines 10000
url_style curly
copy_on_select clipboard
mouse_hide_wait 3.0

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# Useful shortcuts: Ctrl+Shift+T new tab, Ctrl+Shift+Enter split,
# Ctrl+Shift+←/→ switch tab, Ctrl+Shift+=/- font size

# Colors: current theme (automatic or fixed), generated by ~/.config/hypr/themes/theme.py
include colors.conf
