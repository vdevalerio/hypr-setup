# lsd — ls replacement with icons and a compact grid (variable-width columns)
classic: false
color:
  when: auto
  theme: custom          # uses colors.yaml (ANSI colors = terminal/wallpaper palette)
icons:
  when: auto
  theme: fancy
  separator: " "
date: relative
dereference: false
sorting:
  column: name
  reverse: false
  dir-grouping: first
size: short
permission: rwx
no-symlink: false
symlink-arrow: ""
header: false
hyperlink: auto
truncate-owner:
  after:
  marker: ""
