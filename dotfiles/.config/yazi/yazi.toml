#:schema https://yazi-rs.github.io/schemas/yazi.json
# Yazi — file manager (SUPER + E). Press F1 or ~ inside it to see the shortcuts.

[mgr]
ratio          = [ 1, 3, 4 ]       # parent folders · current · preview
sort_by        = "natural"         # file2 before file10
sort_dir_first = true
linemode       = "size"
show_hidden    = false             # "." alterna arquivos ocultos
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
max_width     = 1200
max_height    = 1600
image_quality = 85
