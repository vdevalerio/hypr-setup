#!/usr/bin/nft -f
# Firewall do hypr-setup: bloqueia tudo que ENTRA, libera tudo que SAI.
# Liberado na entrada: respostas de conexões que você abriu, loopback, ping/IPv6 (necessário
# para a rede funcionar) e DHCPv6. Para abrir uma porta (ex.: servidor de dev acessível na rede):
#   sudo nft add rule inet filter input tcp dport 8000 accept      (até reiniciar)
# ou, permanente e fora deste arquivo: um .nft em /etc/nftables.d/input/ com a regra
#   echo 'tcp dport 8000 accept' | sudo tee /etc/nftables.d/input/dev.nft
#   sudo systemctl restart nftables
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        ct state { established, related } accept
        iif lo accept
        meta l4proto ipv6-icmp accept
        meta l4proto icmp accept
        udp dport dhcpv6-client ip6 saddr fe80::/10 accept
        # mDNS (impressoras e dispositivos .local na rede)
        udp dport 5353 ip daddr 224.0.0.251 accept
        udp dport 5353 ip6 daddr ff02::fb accept
        # Portas liberadas por máquina (pasta vazia = nada a mais; curinga sem arquivo não é erro)
        include "/etc/nftables.d/input/*.nft"
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
