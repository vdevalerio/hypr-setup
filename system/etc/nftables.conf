#!/usr/bin/nft -f
# hypr-setup firewall: blocks everything INBOUND, allows everything OUTBOUND.
# Allowed inbound: replies to connections you opened, loopback, ping/IPv6 (needed for the
# network to work) and DHCPv6. To open a port (e.g. a dev server reachable on the network):
#   sudo nft add rule inet filter input tcp dport 8000 accept      (until reboot)
# or, permanently and outside this file: a .nft in /etc/nftables.d/input/ with the rule
#   echo 'tcp dport 8000 accept' | sudo tee /etc/nftables.d/input/dev.nft
#   sudo systemctl restart nftables
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        ct state { established, related } accept
        iif lo accept
        meta l4proto ipv6-icmp accept
        meta l4proto icmp accept
        udp dport dhcpv6-client ip6 saddr fe80::/10 accept
        # mDNS (printers and .local devices on the network)
        udp dport 5353 ip daddr 224.0.0.251 accept
        udp dport 5353 ip6 daddr ff02::fb accept
        # Per-machine allowed ports (empty folder = nothing extra; a wildcard with no files is not an error)
        include "/etc/nftables.d/input/*.nft"
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
