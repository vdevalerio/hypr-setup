# hypr-setup: SSH server for remote access. Keys only, no root, few attempts.
# (sshd keeps the FIRST value it reads, so this 10- file wins over 99-archlinux.conf.)
# Installed by `./install.sh ssh`, which also fills in AllowUsers and the port.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 5:50:20
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 60
ClientAliveCountMax 3
